<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 11 98 98" width="120" height="120" fill="none">
  <defs>
    <!-- Dark tech gradient container -->
    <linearGradient id="dark-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Neon robot glow gradient -->
    <linearGradient id="dark-robot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glowing cyan eyes -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Centered Icon Base (96x96 inside 120x120 container, Dark Mode, Flat / No Shadow) -->
  <g transform="translate(12, 12)">
    <!-- Dark Slate Canvas Base -->
    <rect width="96" height="96" rx="24" fill="url(#dark-bg-grad)" stroke="#334155" stroke-width="1.8" />
    
    <!-- Subtle Blueprint grid lines in dark theme -->
    <line x1="16" y1="36" x2="80" y2="36" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.8" />
    <line x1="16" y1="60" x2="80" y2="60" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.8" />
    <line x1="36" y1="16" x2="36" y2="80" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.8" />
    <line x1="60" y1="16" x2="60" y2="80" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.8" />

    <!-- Corner Canvas handles - Neon Purple/Indigo accents -->
    <rect x="18" y="18" width="6" height="6" rx="1.5" fill="#818CF8" />
    <rect x="72" y="18" width="6" height="6" rx="1.5" fill="#818CF8" />
    <rect x="18" y="72" width="6" height="6" rx="1.5" fill="#818CF8" />
    <rect x="72" y="72" width="6" height="6" rx="1.5" fill="#818CF8" />

    <!-- Centered Robot Face inside Chat Bubble Frame -->
    <rect x="27" y="27" width="42" height="38" rx="12" fill="url(#dark-robot-grad)" stroke="#A5B4FC" stroke-width="1" stroke-opacity="0.25" />
    <!-- Chat tail -->
    <path d="M 40 65 L 36 71 L 46 65 Z" fill="#8B5CF6" />
    
    <!-- Robot Eyes (Electric Cyan glow) & Smile -->
    <rect x="36" y="40" width="7" height="9" rx="3.5" fill="url(#cyan-glow)" />
    <rect x="53" y="40" width="7" height="9" rx="3.5" fill="url(#cyan-glow)" />
    <path d="M 43 54 Q 48 58 53 54" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
    
    <!-- Antenna -->
    <circle cx="48" cy="22" r="3" fill="#C084FC" />
    <line x1="48" y1="25" x2="48" y2="27" stroke="#C084FC" stroke-width="2" />
  </g>
</svg>